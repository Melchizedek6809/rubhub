<!DOCTYPE html>
<html>
<head>
	<title>{{ username }}'s projects</title>
</head>
<body>
	<section>
		<div class="page-header">
			<h1>{{ username }}'s projects</h1>
			{% if is_owner %}
				<a class="btn" href="/projects/new">New project</a>
			{% endif %}
		</div>
		{% if projects.len() == 0 %}
			<p>No projects published yet.</p>
		{% else %}
			<div class="card-grid">
				{% for project in projects %}
					{% include "project_card.html" %}
				{% endfor %}
			</div>
		{% endif %}
	</section>
</body>
</html>
