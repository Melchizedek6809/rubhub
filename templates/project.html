<!DOCTYPE html>
<html>
<head>
    <title>Project</title>
</head>
<body>
    <section>
        <div class="page-header">
            <h1>{{ name }}</h1>
            {% if can_manage %}
                <p><a class="btn" href="/{{ owner }}/{{ slug }}/settings">Project settings</a></p>
            {% endif %}
        </div>
        <div class="card">
            <rubhub-clone-url value="{{ ssh_clone_url }}" label="Clone via SSH"></rubhub-clone-url>
        </div>
        <div class="card">
            <p>Owner: {{ owner }}</p>
            <p>Access: {{ access_level }}</p>
        </div>
    </section>
</body>
</html>
