<!DOCTYPE html>
<html>

<head>
    <title>Project settings</title>
</head>

<body>
    <section>
        <div class="page-header">
            <h1>Project settings</h1>
        </div>
        {% if let Some(msg) = message %}
        <div class="message" role="status">{{ msg }}</div>
        {% endif %}
        <form method="post" action="/{{ owner.name }}/{{ project.slug }}/settings" class="stack card simple-form">
            <rubhub-slug-input autofocus label="Project name" name="name" value="{{ project.name }}"
                autocomplete="off"></rubhub-slug-input>
            <label>
                Public access
                <select name="public_access">
                    <option value="none" {% if project.public_access==AccessType::None %}selected{% endif %}>None
                    </option>
                    <option value="read" {% if project.public_access==AccessType::Read %}selected{% endif %}>Read
                    </option>
                    <option value="write" {% if project.public_access==AccessType::Write %}selected{% endif %}>Write
                    </option>
                </select>
            </label>
            <label>
                Description
                <textarea name="description">{{ project.description }}</textarea>
            </label>
            <div class="actions">
                <button type="submit">Save</button>
            </div>
        </form>
    </section>
</body>

</html>
