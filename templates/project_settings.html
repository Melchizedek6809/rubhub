<!DOCTYPE html>
<html>
<head>
    <title>Project settings</title>
</head>
<body>
    <section>
        <h1>Project settings</h1>
        {% if let Some(msg) = message %}
            <div class="message" role="status">{{ msg }}</div>
        {% endif %}
        <form method="post" action="/{{ username }}/{{ slug }}/settings" class="stack card simple-form">
            <input type="hidden" name="_csrf" value="{{ csrf_token }}">
            <rubhub-slug-input autofocus label="Project name" name="name" value="{{ name }}" autocomplete="off"></rubhub-slug-input>
            <label>
                Public access
                <select name="public_access">
                    <option value="none" {% if public_access == "none" %}selected{% endif %}>None</option>
                    <option value="read" {% if public_access == "read" %}selected{% endif %}>Read</option>
                    <option value="write" {% if public_access == "write" %}selected{% endif %}>Write</option>
                </select>
            </label>
            <div class="actions">
                <button type="submit">Save</button>
            </div>
        </form>
    </section>
</body>
</html>
