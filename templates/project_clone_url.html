<div class="clone-url-wrapper">
  <div class="protocol-switcher">
    {% if logged_in_user.is_some() %}
    <button class="protocol-btn active" data-protocol="ssh">SSH</button>
    <button class="protocol-btn" data-protocol="http">HTTP</button>
    {% else %}
    <button class="protocol-btn active" data-protocol="http">HTTP</button>
    <button class="protocol-btn disabled" data-protocol="ssh" disabled>SSH</button>
    {% endif %}
  </div>
  <div class="clone-url">
    <input
      id="clone-url-input"
      name="cloneUrl"
      type="text"
      readonly
      value="{% if logged_in_user.is_some() %}{{ ssh_clone_url }}{% else %}{{ http_clone_url }}{% endif %}"
      data-ssh-url="{{ ssh_clone_url }}"
      data-http-url="{{ http_clone_url }}"
    />
    <button
      class="copy-button"
      type="button"
      copy-value="{% if logged_in_user.is_some() %}{{ ssh_clone_url }}{% else %}{{ http_clone_url }}{% endif %}"
    >Copy</button>
  </div>
</div>
