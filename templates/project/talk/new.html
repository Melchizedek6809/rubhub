<html>
  <head>
    <title>New Post - {{ owner.name }}/{{ project.name }}</title>
  </head>

  <body>
    {% include "partials/sidebar.html" %}
    <main>
      <section>
        <div class="page-header">
          <h1 class="project-header">
            <a href="{{ owner.uri() }}">{{ owner.name }}</a> /
            <a href="{{ project.uri() }}">{{ project.name }}</a> /
            <a href="{{ project.uri_talk() }}">Talk</a> /
            new
          </h1>
        </div>

        {% include "partials/project_tabs.html" %}

        {% if let Some(msg) = message %}
        <div class="message" role="status">{{ msg }}</div>
        {% endif %}

        <form method="post" action="/~{{ owner.slug }}/{{ project.slug }}/talk/new" class="stack card simple-form">
          <label>
            Subject
            <input type="text" name="title" autofocus autocomplete="off" required placeholder="Title">
          </label>
          <label>
            Message
            <textarea name="content" rows="10" required placeholder="Your message..."></textarea>
          </label>
          <button type="submit" class="success-button"><span class="icon i-plus"></span> Post</button>
        </form>
      </section>
    </main>
  </body>

</html>
