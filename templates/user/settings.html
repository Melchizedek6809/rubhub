<html>
  <head>
    <title>{{ user.name }}/settings</title>
  </head>
  
  <body>
    {% include "partials/sidebar.html" %}
    <main>
      <section>
        <div class="page-header">
          <h1 class="project-header"><a href="{{ user.uri() }}">{{ user.name }}</a> / <a
                                                                                        href="/settings">settings</a></h1>
        </div>

        {% match message %}
        {% when Some with (msg) %}
        <div class="message" role="status">{{ msg }}</div>
        {% when None %}
        {% endmatch %}
        <form method="post" action="/settings" class="stack card simple-form">
          <div class="form-row">
            <label>
              ID (can't be changed)
              <input name="slug" type="text" value="{{ user.slug }}" readonly>
            </label>

            <label>
              Name
              <input name="name" type="text" value="{{ user.name }}">
            </label>
          </div>

          <div class="form-row">
            <label>
              Email
              <input name="email" type="email" value="{{ user.email }}">
            </label>
          </div>

          <label>
            Default branch name (main / master)
            <input name="default_main_branch" type="text" value="{{ user.default_main_branch }}">
          </label>

          <label>
            SSH public keys (one per line)
            <textarea name="ssh_keys" spellcheck="false">{% for key in ssh_keys %}{{ key }}
              {% endfor %}</textarea>
          </label>
          <button type="submit"><span class="icon i-save"></span> Save</button>
        </form>

        <div class="danger-zone card">
          <h2>Danger Zone</h2>
          <p>Deleting your account is permanent and cannot be undone. All of your repositories and account data will be deleted.</p>

          <form method="post" action="/settings/delete/{{ delete_token }}" class="stack simple-form">
            <label>
              Type your user ID to confirm account deletion
              <input name="confirmation" type="text" autocomplete="off" placeholder="{{ user.slug }}">
            </label>
            <button type="submit" class="danger-button"><span class="icon i-trash"></span> Delete Account</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
