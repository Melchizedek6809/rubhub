[package]
name = "jam2nite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
dotenvy = "0.15"
futures = "0.3"
image = { version = "0.25" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros"] }
tower = "0.5"
tower-cookies = "0.11"
tower-http = { version = "0.6", features = ["fs"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
webp = "0.3"
url = "2.5"
base64 = "0.22.1"
sea-orm = { version = "1.1.19", features = [ "sqlx-postgres", "runtime-async-std-native-tls", "macros" ] }
