services:
  rubhub:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_BIND_ADDRESS: 127.0.0.1:3000
      SSH_BIND_ADDRESS: 0.0.0.0:2222
      BASE_URL: https://rubhub.net
      SSH_PUBLIC_HOST: rubhub.net
      REUSE_PORT: TRUE
      DIR_ROOT: /app/data/
    volumes:
      - ./data:/app/data
    deploy:
      replicas: 2
    network_mode: host
