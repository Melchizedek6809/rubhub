[package]
name = "rubhub-auth-store"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
argon2 = { version = "0.5", features = ["password-hash", "rand", "std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1", features = ["serde", "v7"] }
dashmap = "6.1.0"

[dev-dependencies]
tempfile = "3"
